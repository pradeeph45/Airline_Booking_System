  bookingdb:
    image: mysql:8.0
    container_name: booking_db
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: airline_booking_db
    healthcheck:
